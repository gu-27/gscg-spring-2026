# Student reflections — add new entries here.
# Each entry needs: name and quote.
# Separate multiple quotes from the same person with " ... "

- name: Jake Scalzo
  quote: "My key takeaway was relating everything back to my why. The story I want to tell about my career should not be defined purely by successes or any given title — it should always be the push to do hard things and fail while doing them. ... We as students are so focused on getting the seemingly right answer that we end up not thinking about the impact. The true importance is why something matters to a client — and that reframing is going to be central to how I approach projects going forward."

- name: Dylan Hite
  quote: "Nike reinforced how important it is to be intentional early in your career — defining your why, building relationships, and proactively setting up informational conversations. Most career paths are nonlinear, and staying open to different opportunities while developing core skills is what separates people."

- name: Lauren Smith
  quote: "My biggest takeaway was the significance of crafting meaningful relationships within the business world. When someone takes their time to invest in you, you can learn from that — and as you grow, do the same for others. ... I've grown in my communication abilities. Talking with and listening to people in many different industries led me to grow in my professional adaptability and networking skills — I've learned to tailor my language and approach to each professional I meet."

- name: Mia Crosby
  quote: "You don't need everything figured out — you just need to be willing to learn and grow along the way. ... Lean into the hard things — when I feel uncomfortable or in the unknown, that is where I have grown the most. And lean into communities. They are here to help. ... I felt super nervous coming into this experience and felt like I was not capable. After this semester, I have grown in my ability to sit with being uncomfortable and nervous — and in those moments, that is when I figure out new ideas. All ideas don't need to be 100% correct before sharing."

- name: Noah Liu
  quote: "That presentation was one of the more stressful experiences I have had — I did not expect to walk into a full boardroom. Having that experience, presenting under pressure and feeling confident in the work we had done, was formative and memorable for all of us."

- name: Rachel
  quote: "It is always a privilege to present to our clients in person. The feedback we received was invaluable — and the willingness to connect personally after the meeting continues to reinforce how important GSCG is to student growth."

- name: Matthew Marin
  quote: "Being able to hear feedback and connect with professionals in the sports industry was so rewarding. Knowing that they were willing to give up time for us even though they had a game that same evening is something I will carry into my career."

- name: Samantha Smith
  quote: "Lisa said she chooses her job based on where she is at in life — right now she is 'enjoying the comfort.' That is a skill in my opinion: to just absorb the place you are at in life. ... Frances was quick to say more than 75% of their work is a challenge. She highlights failures rather than successes, noting that without failure there is no growth. ... One takeaway from this semester is the importance of your network and helping one another grow. It was so awesome to watch us all help one another — and to see professionals do the same thing throughout their careers."

- name: Allison Kann
  quote: "There are a million ways to get where you want to be, and the path is not linear. Failure and rejection is just redirection — it is true, and it has been true in my own life. That reminder was one thousand percent necessary. ... When you are faced with a problem — figure it out. Lean into it, and lean into others to solve it. Set yourself apart by focusing on the little things: remembering names, following up, fostering connections."

- name: Charlie Herman
  quote: "Individual drive is key but ineffective if not paired with strong teamwork. Working with a shared vision makes the hard work easier — and empowers you to advocate for the positions that fit you best."

- name: Paige Olson
  quote: "Growth doesn't always follow a clear or linear path — it reflects the effort, curiosity, and initiative you bring to it. One of my biggest takeaways was how important relationships are in the growth process. Growth is not something you do alone. ... Hearing that if you're not being challenged, you're not growing — that was a powerful reminder. This experience pushed me to step outside my comfort zone in a way that led to meaningful growth, both personally and professionally."

- name: Owen Hyatt
  quote: "When you're younger, there is time to put your head down and grind it out. As you grow, a transition into a role where work-life balance is more accepted becomes a decision you can make intentionally. Hearing that framing humanized the career grind for me."

- name: Marcus Heppner
  quote: "Work put in behind the scenes can be crucial in nurturing your skillset and added value to an organization. Even when it is not visible, it supports a wider career outlook. ... This semester made me significantly more open to growing through failure, and not strictly aiming to impress or expect perfection in every trial. I am a lot more open to learning through challenges."

- name: Eamon Mohrbacher
  quote: "Find a balance between what you are doing professionally and what stage of life you are in. Build relationships and friendships that make your job easier and worthwhile. Those two things together — that is what stood out from this entire experience."

- name: Thomas Banzhof
  quote: "The best way to respond to tough client feedback is to rebound, regroup, and channel your frustration into improvement. When we critique each other's ideas, they get better. When we listen to feedback from others, we are better. ... I worked on the same problem for weeks without completely understanding why. Then, in the last couple of weeks, it all came together. I'm proud of how I kept getting my work done and trusting the process — I can see myself growing as a leader, presenter, and researcher."

- name: Cameron Ames
  quote: "One of my biggest takeaways was learning not only how to find meaningful information, but how to present it in a clear and powerful way. It's super important to know your stuff — but also to be able to talk about it and express why it matters. ... Every week was a different thing to research, presenting a new challenge. Learning to stay versatile and adapt was a major growing experience for me."

- name: Kenzie Bushnell
  quote: "This was my first time researching a topic in depth over an extended period of time. I had no prior knowledge of sports analytics coming in — and seeing all of that hard work pay off at the final presentation showed me what I am capable of when I lean into something unfamiliar."

- name: Emma Fuller
  quote: "I have become more comfortable with spontaneity and being quick to react when problems arise. The socials were a great way to connect with team members I didn't otherwise get to interact with as much — and I'm excited for GSCG marketing to keep growing."
