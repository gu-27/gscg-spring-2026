# Student reflections — add new entries here.
# Each entry needs: name, year, quote
# Quotes from Mia and Lauren may overlap with new submissions — keep both and deduplicate by hand if needed.

- name: Jake Scalzo
  year: Junior · Finance
  quote: "My key takeaway was relating everything back to my why. The story I want to tell about my career should not be defined purely by successes or any given title — it should always be the push to do hard things and fail while doing them."

- name: Dylan Hite
  year: Junior · Business
  quote: "Nike reinforced how important it is to be intentional early in your career — defining your why, building relationships, and proactively setting up informational conversations. Most career paths are nonlinear, and staying open to different opportunities while developing core skills is what separates people."

- name: Lauren Smith
  year: Junior · Business
  quote: "My biggest takeaway was the significance of crafting meaningful relationships within the business world. When someone takes their time to invest in you, you can learn from that — and as you grow, do the same for others."

- name: Mia Crosby
  year: Junior · Business
  quote: "You don't need everything figured out — you just need to be willing to learn and grow along the way. Seeing how everyone had a different path, and how their reasons for what they do have changed over time, reminded me that adapting is not a weakness. It's the whole point."

- name: Noah Liu
  year: Freshman · Business
  quote: "That presentation was one of the more stressful experiences I have had — I did not expect to walk into a full boardroom. Having that experience, presenting under pressure and feeling confident in the work we had done, was formative and memorable for all of us."

- name: Jake Scalzo
  year: Junior · Finance
  quote: "We as students are so focused on getting the seemingly right answer that we end up not thinking about the impact. The true importance is why something matters to a client — and that reframing is going to be central to how I approach projects going forward."

- name: Rachel
  year: Senior
  quote: "It is always a privilege to present to our clients in person. The feedback we received was invaluable — and the willingness to connect personally after the meeting continues to reinforce how important GSCG is to student growth."

- name: Matthew Marin
  year: Junior · Business
  quote: "Being able to hear feedback and connect with professionals in the sports industry was so rewarding. Knowing that they were willing to give up time for us even though they had a game that same evening is something I will carry into my career."

- name: Samantha Smith
  year: Senior · Accounting & Operations
  quote: "Lisa said she chooses her job based on where she is at in life — right now she is 'enjoying the comfort.' That is a skill in my opinion: to just absorb the place you are at in life. It was a real, honest piece of advice that I needed to hear."

- name: Allison Kann
  year: Junior · Marketing
  quote: "There are a million ways to get where you want to be, and the path is not linear. Failure and rejection is just redirection — it is true, and it has been true in my own life. That reminder was one thousand percent necessary."

- name: Charlie Herman
  year: Senior · Accounting, Finance & MIS
  quote: "Individual drive is key but ineffective if not paired with strong teamwork. Working with a shared vision makes the hard work easier — and empowers you to advocate for the positions that fit you best."

- name: Paige Olson
  year: Senior · Marketing & Finance
  quote: "Growth doesn't always follow a clear or linear path — it reflects the effort, curiosity, and initiative you bring to it. One of my biggest takeaways was how important relationships are in the growth process. Growth is not something you do alone."

- name: Owen Hyatt
  year: Senior · Finance & Accounting
  quote: "When you're younger, there is time to put your head down and grind it out. As you grow, a transition into a role where work-life balance is more accepted becomes a decision you can make intentionally. Hearing that framing humanized the career grind for me."

- name: Marcus Heppner
  year: Senior · Business & Sports Management
  quote: "Work put in behind the scenes can be crucial in nurturing your skillset and added value to an organization. Even when it is not visible, it supports a wider career outlook — and this experience reminded me how important it is to challenge yourself through unique opportunities early on."

- name: Allison Kann
  year: Junior · Marketing
  quote: "When you are faced with a problem — figure it out. Lean into it, and lean into others to solve it. Set yourself apart by focusing on the little things: remembering names, following up, fostering connections. That is what they told us, and it landed."

- name: Samantha Smith
  year: Senior · Accounting & Operations
  quote: "Frances was quick to say more than 75% of their work is a challenge. She highlights failures rather than successes, noting that without failure there is no growth. Sports is about creating experiences — and I can imagine that creates a special environment for the people making it happen."

- name: Eamon Mohrbacher
  year: Senior · Finance & Accounting
  quote: "Find a balance between what you are doing professionally and what stage of life you are in. Build relationships and friendships that make your job easier and worthwhile. Those two things together — that is what stood out from this entire experience."

- name: Paige Olson
  year: Senior · Marketing & Finance
  quote: "Hearing that if you're not being challenged, you're not growing — that was a powerful reminder. This experience pushed me to step outside my comfort zone in a way that led to meaningful growth, both personally and professionally. And you could feel how much they genuinely enjoy what they do."
