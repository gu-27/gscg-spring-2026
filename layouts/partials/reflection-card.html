<div style="background:white;border-radius:14px;padding:1.4rem;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:.85rem;">
  <div style="font-family:'Libre Baskerville',serif;font-size:.88rem;font-style:italic;color:#374151;line-height:1.75;border-left:3px solid #cc0000;padding-left:.85rem;flex:1;">
    "{{ .quote }}"
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem;">
    <div>
      <div style="font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:700;color:#0f172a;">{{ .name }}</div>
      <div style="font-family:'Outfit',sans-serif;font-size:.73rem;color:#64748b;">{{ .year }}</div>
    </div>
    <span style="font-family:'Outfit',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:#f1f5f9;color:#475569;padding:.25rem .6rem;border-radius:20px;white-space:nowrap;">{{ .context }}</span>
  </div>
</div>
