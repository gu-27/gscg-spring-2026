{{ define "main" }}

<section class="page-hero bg-navy">
  <div class="container page-hero-inner">
    <span class="eyebrow eyebrow-light">GSCG Spring 2026</span>
    <h1 class="display-lg" style="color:white;">{{ .Title }}</h1>
    {{ with .Description }}<p class="body-lg" style="color:rgba(255,255,255,.65);margin-top:.75rem;max-width:560px;">{{ . }}</p>{{ end }}
  </div>
</section>

<div style="max-width:960px;margin:0 auto;padding:3rem 1.5rem 4rem;">

  <style>
    .reflection-grid { columns: 3; column-gap: 1.25rem; }
    .reflection-grid > * { break-inside: avoid; margin-bottom: 1.25rem; display: inline-block; width: 100%; }
    @media(max-width:768px){ .reflection-grid { columns: 2; } }
    @media(max-width:480px){ .reflection-grid { columns: 1; } }
  </style>

  <div class="reflection-grid">
    {{ range .Site.Data.reflections }}
      {{ partial "reflection-card.html" . }}
    {{ end }}
  </div>

  <p style="font-family:'Outfit',sans-serif;font-size:.85rem;color:#94a3b8;text-align:center;margin-top:2rem;">
    More reflections coming soon.
  </p>

</div>
{{ end }}
