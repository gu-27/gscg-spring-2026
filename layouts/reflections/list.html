{{ define "main" }}
<div style="max-width:900px;margin:0 auto;padding:2.5rem 1.5rem 4rem;">

  <div style="margin-bottom:2.5rem;">
    <h1 style="font-family:'Outfit',sans-serif;font-size:2rem;font-weight:800;color:#0f172a;margin:0 0 .5rem;">Student Reflections</h1>
    <p style="font-family:'Outfit',sans-serif;font-size:1rem;color:#64748b;margin:0;">
      Growth is at the heart of everything we do at GSCG. These are the words of our students — unfiltered, honest, and earned.
    </p>
  </div>

  <style>
    .reflection-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem; }
    @media(max-width:768px){ .reflection-grid { grid-template-columns:repeat(2,1fr); } }
    @media(max-width:480px){ .reflection-grid { grid-template-columns:1fr; } }
  </style>
  <div class="reflection-grid">
    {{ range .Site.Data.reflections }}
      {{ partial "reflection-card.html" . }}
    {{ end }}
  </div>

  <p style="font-family:'Outfit',sans-serif;font-size:.85rem;color:#94a3b8;text-align:center;margin-top:2rem;">
    More reflections coming soon.
  </p>

</div>
{{ end }}
